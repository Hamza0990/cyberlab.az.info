<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>404 — Səhifə tapılmadı | CyberLab</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0A0E13;--text:#D9E2E9;--text-dim:#8A9AA8;--red:#FF3B4E;--blue:#26C9E0;--border:#232E3A;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;
       display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;}
  .code{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(64px,14vw,140px);
        background:linear-gradient(90deg,var(--red),var(--blue));-webkit-background-clip:text;background-clip:text;
        color:transparent;line-height:1;}
  .msg{font-family:'IBM Plex Mono',monospace;font-size:14px;color:var(--text-dim);margin:18px 0 30px;}
  a{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--text);border:1px solid var(--border);
    padding:12px 22px;border-radius:100px;text-decoration:none;transition:border-color .25s,color .25s;}
  a:hover{border-color:var(--red);color:var(--red);}
  .blink{animation:blink 1.4s infinite;}
  @keyframes blink{50%{opacity:.3;}}
</style>
</head>
<body>
  <div class="code">404</div>
  <p class="msg">[ ERROR ] Sorğu edilən resurs tapılmadı <span class="blink">_</span></p>
  <a href="/">← Ana səhifəyə qayıt</a>
</body>
</html>
